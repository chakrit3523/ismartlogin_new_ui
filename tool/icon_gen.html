<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Ensure background matches in case of transparent edges, though we want full bleed */
            background: transparent; 
        }

        .icon-container {
            position: relative;
            width: 1024px;
            height: 1024px;
            overflow: hidden; /* Clips the ribbon that goes outside */
            
            /* Use the image */
            background-image: url('../assets/launcher/launcher_original.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* RIBBON STYLE */
        .ribbon-wrapper {
            position: absolute;
            width: 500px;
            height: 500px;
            overflow: hidden;
            top: 0;
            left: 0;
            /* Pointer events: none so it doesn't block */
            pointer-events: none;
        }

        .ribbon {
            position: absolute;
            top: -10px;
            right: -10px; /* irrelevant for top-left */
            left: -80px; /* Adjust to position properly */
            top: 80px;
            
            width: 500px;
            background: #d32f2f; /* Red */
            transform: rotate(-45deg);
            text-align: center;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            
            /* Border for separation */
            border: 2px solid white;
        }
        
        /* Better Ribbon Approach using a rotated strip from center */
        .strip {
            position: absolute;
            background: #cc0000;
            top: 150px;
            left: -130px;
            width: 600px;
            padding: 20px 0;
            transform: rotate(-45deg);
            transform-origin: center;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 4px solid white;
            
            /* Text Style */
            color: white;
            font-family: sans-serif;
            font-weight: 900;
            font-size: 80px;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
        }

    </style>
</head>
<body>

    <div class="icon-container" id="capture-target">
        <div class="strip">DEMO</div>
    </div>

</body>
</html>
